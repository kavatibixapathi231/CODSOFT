<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Master - Flask Backend</title>
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .message-card { padding: 32px; border-radius: 20px; background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(148, 163, 184, 0.2); max-width: 520px; }
    h1 { margin-top: 0; font-size: 2rem; }
    p { color: #cbd5e1; line-height: 1.6; }
    code { background: rgba(255,255,255,0.08); padding: 4px 8px; border-radius: 8px; color: #e2e8f0; }
    a { color: #38bdf8; }
  </style>
</head>
<body>
  <div class="message-card">
    <h1>Quiz Master Flask App</h1>
    <p>This quiz app is served by Flask and uses SQLite to store quiz content and result data.</p>
    <p>Run the app from the project folder with:</p>
    <p><code>python app.py</code></p>
    <p>Then open:</p>
    <p><a href="http://127.0.0.1:5000/">http://127.0.0.1:5000/</a></p>
  </div>
</body>
</html>
